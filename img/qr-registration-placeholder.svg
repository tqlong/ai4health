  <rect x="105" y="470" width="145" height="145" fill="#132f35"/>
  <rect x="135" y="500" width="85" height="85" fill="#ffffff"/>
  <rect x="305" y="300" width="48" height="48" fill="#0c766d"/>
  <rect x="380" y="300" width="48" height="48" fill="#132f35"/>
